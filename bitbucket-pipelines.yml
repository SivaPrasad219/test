pipelines:
  default:       
    - step:
        name: Run Tests & Generate Coverage
        size: 2x
        runs-on:
          - self.hosted
          - linux
        caches:
          - node
        script:
          - npm run test:coverage   # or directly: npm test -- --coverage
          # After this, you should have ./coverage/lcov.info file

    - step:
        name: SonarQube Analysis
        size: 2x
        runs-on:
          - self.hosted
          - linux
        caches:
          - sonar
          - node  # optional
        script:
          - export SONAR_SCANNER_OPTS="-Xmx2048m"
          - pipe: sonarsource/sonarqube-scan:3.0.2
            variables:
              SONAR_HOST_URL: ${SONAR_HOST_URL}
              SONAR_TOKEN: ${SONAR_TOKEN}
              EXTRA_ARGS: >-
                -Dsonar.projectKey=test
                -Dsonar.projectName=test
                -Dsonar.sources=.
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**  # exclude coverage folder too
                -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info   # ← THIS IS THE MOST IMPORTANT LINE!
                -Dsonar.tests=.                                             # optional: if tests are mixed with sources
                -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js           # adjust to your test file pattern

    - step:  # ← your quality gate check remains the same
        name: Check SonarQube Quality Gate
        size: 2x
        runs-on:
          - self.hosted
          - linux
        script:
          - pipe: sonarsource/sonarqube-quality-gate:1.2.1
            variables:
              SONAR_TOKEN: ${SONAR_TOKEN}
              DEBUG: "true"

    # Your docker build & push step remains unchanged...

definitions:
  caches:
    sonar: ~/.sonar
    node: ~/.npm  # optional but recommended
  services:
    docker:
      memory: 3072

clone:
  depth: full

options:
  docker: true